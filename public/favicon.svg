<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Open Book / Bitácora Symbol -->
  <g filter="url(#glow)" transform="translate(18, 30)">
    <!-- Left Page -->
    <path d="M 44,10 C 28,6 12,9 2,13 L 2,55 C 12,51 28,48 44,52 Z" fill="url(#pageGrad)" />
    <!-- Right Page -->
    <path d="M 48,10 C 64,6 80,9 90,13 L 90,55 C 80,51 64,48 48,52 Z" fill="url(#pageGrad)" />
    
    <!-- Spine / Center seam -->
    <path d="M 44,10 C 46,9 46,9 48,10 L 48,52 C 46,51 46,51 44,52 Z" fill="#047857" />

    <!-- Document Lines (Left page) -->
    <line x1="10" y1="22" x2="36" y2="20" stroke="#047857" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="10" y1="30" x2="36" y2="28" stroke="#047857" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <line x1="10" y1="38" x2="28" y2="36" stroke="#047857" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- Golden Bookmark Ribbon -->
    <path d="M 44,8 L 48,8 L 48,34 L 46,30 L 44,34 Z" fill="url(#goldGrad)" />

    <!-- Golden Quill Nib / Feather Symbol floating on right page -->
    <g transform="translate(52, 14)">
      <!-- Quill Plume -->
      <path d="M 12,28 C 16,20 22,10 32,2 C 34,14 26,24 16,32 Z" fill="url(#goldGrad)" />
      <!-- Nib Tip -->
      <polygon points="12,28 16,32 10,36" fill="#fef08a" />
      <line x1="12" y1="28" x2="26" y2="12" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Base / Stand accent -->
    <path d="M 4,58 C 22,54 44,54 46,57 C 48,54 70,54 88,58" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
